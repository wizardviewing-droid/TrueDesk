name: Windows app

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Build the desk
        env:
          DESK_NODE: "1"
        run: npm ci && node scripts/with-app-env.mjs node ./node_modules/vite/bin/vite.js build && npm run db:migrate
      - name: Check the server was built
        shell: pwsh
        run: |
          if (-not (Test-Path .output/server/index.mjs)) { throw "The desk server was not built." }
          if (Test-Path desktop/packed) { Remove-Item -Recurse -Force desktop/packed }
          Copy-Item -Recurse .output desktop/packed
      - name: Package the Windows app
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: npm install && npx electron-builder --win portable --x64 --publish never
      - name: Check the package contains the desk
        shell: pwsh
        run: |
          $entry = "desktop/release/win-unpacked/resources/app-server/server/index.mjs"
          if (-not (Test-Path $entry)) { throw "The desk files were not packed." }
      - name: Zip the app
        shell: pwsh
        run: Compress-Archive -Force -Path desktop/release/TrueDesk.exe -DestinationPath desktop/release/TrueDesk.zip
      - name: Publish the download
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          notes="Windows app for the accounts desk. Unzip TrueDesk.zip and open TrueDesk.exe."
          if gh release view v1.0.2 >/dev/null 2>&1; then
            gh release upload v1.0.2 desktop/release/TrueDesk.exe desktop/release/TrueDesk.zip --clobber
          else
            gh release create v1.0.2 desktop/release/TrueDesk.exe desktop/release/TrueDesk.zip --title "True Desk" --notes "$notes"
          fi
