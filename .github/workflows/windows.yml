name: Windows app

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Build the desk
        env:
          DESK_NODE: "1"
        run: npm ci && node scripts/with-app-env.mjs node ./node_modules/vite/bin/vite.js build && npm run db:migrate
      - name: Check the server was built
        shell: pwsh
        run: |
          if (-not (Test-Path .output/server/index.mjs)) { throw "The desk server was not built." }
          if (Test-Path desktop/packed) { Remove-Item -Recurse -Force desktop/packed }
          Copy-Item -Recurse .output desktop/packed
      - name: Package the Windows app
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: npm install && npx electron-builder --win portable --x64 --publish never
      - name: Check the package contains the desk
        shell: pwsh
        run: |
          $entry = "desktop/release/win-unpacked/resources/app-server/server/index.mjs"
          if (-not (Test-Path $entry)) { throw "The desk files were not packed." }
      - name: Zip the app
        shell: pwsh
        run: |
          Set-Content -Path desktop/release/version.txt -Value "1.0.21" -NoNewline
          Compress-Archive -Force -Path desktop/release/TrueDesk.exe, desktop/release/version.txt -DestinationPath desktop/release/TrueDesk.zip
      - name: Keep a copy of the zip
        uses: actions/upload-artifact@v4
        with:
          name: TrueDesk-zip
          path: desktop/release/TrueDesk.zip
          if-no-files-found: error
      - name: Publish the download
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag=v1.0.21
          notes="Windows app for the accounts desk. Unzip TrueDesk.zip into Y:\\accounts\\Tools\\Task application. A True Desk icon is added to the desktop, and a newer copy in that folder updates the app next time it is opened. Monthly tasks move off weekends and bank holidays."
          for i in 1 2 3 4 5 6; do
            if gh release view "$tag" >/dev/null 2>&1; then
              break
            fi
            if gh release create "$tag" --title "True Desk" --notes "$notes"; then
              break
            fi
            echo "create failed, retry $i"
            sleep 20
          done
          gh release view "$tag" >/dev/null
          for i in 1 2 3 4 5 6; do
            if gh release upload "$tag" desktop/release/TrueDesk.zip --clobber; then
              gh release view "$tag" --json assets --jq '.assets[].name'
              exit 0
            fi
            echo "upload failed, retry $i"
            sleep 25
          done
          exit 1
